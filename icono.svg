<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Gradient for Squircle Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan/Blue Gradient for Accents -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Radar Discovery Arc -->
  <path d="M 120 180 A 160 160 0 0 1 392 180" 
        fill="none" 
        stroke="#06b6d4" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Middle Radar Discovery Arc -->
  <path d="M 168 200 A 108 108 0 0 1 344 200" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Inner Radar Discovery Arc -->
  <path d="M 216 220 A 56 56 0 0 1 296 220" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Central Transmitter Pulse Dot -->
  <circle cx="256" cy="235" r="14" fill="#ffffff" />

  <!-- Network Switch Chassis (1U Rack Unit) -->
  <rect x="76" y="270" width="360" height="150" rx="24" 
        fill="#0f172a" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linejoin="round" />

  <!-- Ethernet RJ45 Ports (High Contrast Geometric Cutouts) -->
  <!-- Port 1 (Active / Linked) -->
  <rect x="116" y="318" width="52" height="54" rx="10" fill="#06b6d4" />
  <!-- Port 2 -->
  <rect x="194" y="318" width="52" height="54" rx="10" fill="#ffffff" />
  <!-- Port 3 -->
  <rect x="272" y="318" width="52" height="54" rx="10" fill="#ffffff" />

  <!-- Activity LEDs Column on the right -->
  <circle cx="366" cy="332" r="11" fill="#10b981" />
  <circle cx="396" cy="332" r="11" fill="#06b6d4" />
  <circle cx="366" cy="362" r="11" fill="#3b82f6" />
  <circle cx="396" cy="362" r="11" fill="#10b981" />
</svg>
