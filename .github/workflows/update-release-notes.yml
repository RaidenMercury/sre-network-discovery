name: Update Release Notes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Release v2.0.2 Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v2.0.2 --notes-file .github/RELEASE_v2.0.2.md
