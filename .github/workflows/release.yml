name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H=windowsgui" -o dist/sre-network-discovery.exe ./cmd/sre-discovery
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/sre-discovery-linux ./cmd/sre-discovery

      - name: Create Release Packages
        run: |
          cd dist
          cp ../README.md .
          cp ../icono.ico .
          cp ../icono.svg .
          zip -9 sre-network-discovery-${{ github.ref_name }}-windows-x64.zip sre-network-discovery.exe README.md icono.ico
          tar -czvf sre-network-discovery-${{ github.ref_name }}-linux-x64.tar.gz sre-discovery-linux README.md icono.svg
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -f ".github/RELEASE_${TAG_NAME}.md" ]; then
            NOTES_FILE=".github/RELEASE_${TAG_NAME}.md"
          else
            NOTES_FILE="release_notes.md"
            cat << EOF > release_notes.md
          ## SRE Network Discovery ${TAG_NAME}

          Release ${TAG_NAME}
          EOF
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Ensuring published status and updating notes/assets..."
            gh release edit "$TAG_NAME" \
              --draft=false \
              --title "SRE Network Discovery $TAG_NAME" \
              --notes-file "$NOTES_FILE"
            gh release upload "$TAG_NAME" \
              dist/sre-network-discovery-${TAG_NAME}-windows-x64.zip \
              dist/sre-network-discovery-${TAG_NAME}-linux-x64.tar.gz \
              --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              dist/sre-network-discovery-${TAG_NAME}-windows-x64.zip \
              dist/sre-network-discovery-${TAG_NAME}-linux-x64.tar.gz \
              --title "SRE Network Discovery $TAG_NAME" \
              --notes-file "$NOTES_FILE"
          fi
