name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-publish'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H=windowsgui" -o dist/sre-network-discovery.exe ./cmd/sre-discovery
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/sre-discovery-linux ./cmd/sre-discovery

      - name: Create Release Packages
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "release-publish" ]; then
            TAG_NAME="v2.1.0"
          fi
          cd dist
          cp ../README.md .
          cp ../icono.ico .
          cp ../icono.svg .
          zip -9 sre-network-discovery-${TAG_NAME}-windows-x64.zip sre-network-discovery.exe README.md icono.ico
          tar -czvf sre-network-discovery-${TAG_NAME}-linux-x64.tar.gz sre-discovery-linux README.md icono.svg
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "release-publish" ]; then
            TAG_NAME="v2.1.0"
          fi

          if [ -f ".github/RELEASE_${TAG_NAME}.md" ]; then
            NOTES_FILE=".github/RELEASE_${TAG_NAME}.md"
          else
            NOTES_FILE="release_notes.md"
            cat << EOF > release_notes.md
          ## SRE Network Discovery ${TAG_NAME}

          Release ${TAG_NAME}
          EOF
          fi

          echo "Deleting previous release draft if any for $TAG_NAME..."
          gh release delete "$TAG_NAME" --yes || true

          echo "Creating fresh public release for $TAG_NAME..."
          gh release create "$TAG_NAME" \
            dist/sre-network-discovery-${TAG_NAME}-windows-x64.zip \
            dist/sre-network-discovery-${TAG_NAME}-linux-x64.tar.gz \
            --title "SRE Network Discovery $TAG_NAME" \
            --notes-file "$NOTES_FILE"
