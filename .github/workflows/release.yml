name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/sre-network-discovery.exe ./cmd/sre-discovery
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/sre-discovery-linux ./cmd/sre-discovery

      - name: Create Release Packages
        run: |
          cd dist
          cp ../README.md .
          cp ../icono.ico .
          cp ../icono.svg .
          zip -9 sre-network-discovery-${{ github.ref_name }}-windows-x64.zip sre-network-discovery.exe README.md icono.ico
          tar -czvf sre-network-discovery-${{ github.ref_name }}-linux-x64.tar.gz sre-discovery-linux README.md icono.svg
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat << EOF > release_notes.md
          ## SRE Network Discovery \${TAG_NAME}

          Reescritura en **Go**: motor ultraligero (~6 MB), libre de dependencias externas, interfaz gráfica moderna tipo glassmorphism y mitigación total de falsos positivos en Windows Defender.

          ### ✨ Novedades y Correcciones en esta Versión

          - **Apertura Automática en Windows**: Al ejecutar la aplicación, ahora se abre automáticamente la ventana de interfaz de escritorio (usando Edge/Chrome en modo app sin bordes de navegador, o el navegador web predeterminado del sistema).
          - **Privacidad y Limpieza de IPs**: Se eliminaron las direcciones IP fijas de desarrollo en los mensajes de inicio; la aplicación escucha de forma segura en \`127.0.0.1\` por defecto evitando bloqueos o alertas del firewall de Windows.
          - **Soporte Completo para Switches Huawei y Multivendor (LLDP)**:
            - Extracción inteligente del modelo de switch desde \`SystemDescription\` (ej. Serie \`Huawei S5720\`, \`CloudEngine\`, etc.) cuando la trama LLDP no incluye TLV de modelo propietario.
            - Decodificación robusta de dirección IP de gestión en TLV 8 (IPv4 / IPv6).
            - Detección de puerto desde TLV 2 y fallback a \`PortDescription\` (TLV 4).
            - Extracción de VLAN de acceso/nativa (IEEE 802.1Q / PVID TLV 127).
          - **Fusión Inteligente CDP + LLDP**:
            - Si el switch conectado envía anuncios tanto en Cisco CDP como en estándar LLDP por el mismo puerto físico, la aplicación ahora los fusiona automáticamente en una única tarjeta completa con el distintivo \`CDP + LLDP\`, eliminando tarjetas duplicadas o campos vacíos.
          - **Captura ETW Resiliente (\`BothPhysicalAndSwitch\`)**:
            - Soporte para equipos con Hyper-V, WSL2, Docker o Virtual Switch habilitado mediante captura tanto en tarjetas físicas como en puentes virtuales.
          - **Validación Integral de Red y Modos Acumulativo / Daemon**:
            - Validación de enlace físico (Carrier Up/Down), IP DHCP, Gateway ping, DNS y canal seguro TLS.
            - Modo daemon de auto-extracción (\`--auto\`) al enchufar cable Ethernet.
            - Modo acumulativo (\`-a\` / \`--append\`) para inventarios progresivos de racks/rosetas.
            - Exportación instantánea a **JSON**, **Markdown** y **CSV**.

          ### 📦 Instalación y Uso

          1. Descarga el archivo \`sre-network-discovery-\${TAG_NAME}-windows-x64.zip\`.
          2. Descomprime en la carpeta de tu preferencia.
          3. Haz doble clic en \`sre-network-discovery.exe\` (o clic derecho → *"Ejecutar como Administrador"*).
          4. La aplicación abrirá automáticamente la interfaz de escritorio lista para escanear y validar.
          EOF

          gh release create "$TAG_NAME" \
            dist/sre-network-discovery-${TAG_NAME}-windows-x64.zip \
            dist/sre-network-discovery-${TAG_NAME}-linux-x64.tar.gz \
            --title "SRE Network Discovery $TAG_NAME" \
            --notes-file release_notes.md

