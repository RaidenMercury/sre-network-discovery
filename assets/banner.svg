<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#3b82f6;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#06b6d4" flood-opacity="0.15" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(0.98); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(950px); }
      }
      @keyframes ledBlink1 {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 5px #10b981); }
        50% { fill: #047857; filter: none; }
      }
      @keyframes ledBlink2 {
        0%, 100% { fill: #06b6d4; filter: drop-shadow(0 0 5px #06b6d4); }
        50% { fill: #0891b2; filter: none; }
      }
      @keyframes textShimmer {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.75)); }
      }
      .card-bg {
        filter: url(#shadow);
      }
      .sweep-beam {
        animation: beamMove 4.5s ease-in-out infinite;
      }
      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 3.5px;
        animation: textShimmer 4s ease-in-out infinite;
      }
      .sub-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 2.2px;
        text-transform: uppercase;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .led1 { animation: ledBlink1 1.4s ease-in-out infinite; }
      .led2 { animation: ledBlink2 1.8s ease-in-out infinite 0.3s; }
      .led3 { animation: ledBlink1 2.1s ease-in-out infinite 0.7s; }
      .pulse-ring {
        transform-origin: 75px 110px;
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="860" height="200" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" class="card-bg" />

  <!-- Subtle Center Radial Glow -->
  <rect x="12" y="12" width="856" height="196" rx="15" fill="url(#centerGlow)" pointer-events="none" />

  <!-- Matrix Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.25">
    <line x1="12" y1="50" x2="868" y2="50" />
    <line x1="12" y1="100" x2="868" y2="100" />
    <line x1="12" y1="150" x2="868" y2="150" />
    <line x1="160" y1="12" x2="160" y2="208" />
    <line x1="340" y1="12" x2="340" y2="208" />
    <line x1="520" y1="12" x2="520" y2="208" />
    <line x1="700" y1="12" x2="700" y2="208" />
  </g>

  <!-- Animated Laser Scan Beam -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="12" y="12" width="856" height="196" rx="15" />
    </clipPath>
    <rect class="sweep-beam" x="0" y="10" width="220" height="200" fill="url(#beamGrad)" opacity="0.12" />
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </g>

  <!-- Left Side: Cybernetic Switch & Radar Core -->
  <g transform="translate(32, 45)">
    <!-- Radar Rings -->
    <g class="pulse-ring">
      <circle cx="65" cy="65" r="54" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
      <circle cx="65" cy="65" r="40" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="65" cy="65" r="26" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />
    </g>

    <!-- Switch Icon 1U Chassis -->
    <rect x="15" y="47" width="100" height="36" rx="6" fill="#141c2e" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadow)" />
    <rect x="22" y="55" width="86" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1" />

    <!-- Switch Ports (RJ45 with link lights) -->
    <rect x="28" y="60" width="11" height="10" rx="1.5" fill="#1e293b" />
    <circle cx="33.5" cy="57" r="1.8" class="led1" />

    <rect x="44" y="60" width="11" height="10" rx="1.5" fill="#1e293b" />
    <circle cx="49.5" cy="57" r="1.8" class="led2" />

    <rect x="60" y="60" width="11" height="10" rx="1.5" fill="#1e293b" />
    <circle cx="65.5" cy="57" r="1.8" class="led1" />

    <rect x="76" y="60" width="11" height="10" rx="1.5" fill="#1e293b" />
    <circle cx="81.5" cy="57" r="1.8" class="led3" />

    <rect x="92" y="60" width="11" height="10" rx="1.5" fill="#1e293b" />
    <circle cx="97.5" cy="57" r="1.8" class="led2" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(195, 68)">
    <!-- Subtitle / Eyebrow -->
    <text x="0" y="0" class="sub-title" fill="#38bdf8" font-size="12" opacity="0.95">
      ⚡ RECONOCIMIENTO L2 • AUDITORÍA DE RED &amp; SWITCHES
    </text>

    <!-- Main Title -->
    <text x="0" y="42" class="main-title" fill="url(#titleGrad)" font-size="34">
      SRE NETWORK DISCOVERY
    </text>

    <!-- Tagline -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94a3b8" font-weight="500">
      Captura nativa de tramas <tspan fill="#38bdf8" font-weight="700">CDP</tspan> &amp; <tspan fill="#38bdf8" font-weight="700">LLDP</tspan> • Identificación de Switches, Puertos y VLANs
    </text>
  </g>

  <!-- Badges Ribbon at Bottom -->
  <g transform="translate(195, 160)">
    <!-- Badge 1: Version PRO -->
    <g>
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#0f2b3e" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="12" cy="13" r="3.5" fill="#06b6d4" />
      <text x="22" y="17" class="badge-text" fill="#a5f3fc">v2.0.2 PRO</text>
    </g>

    <!-- Badge 2: Auto-Extracción -->
    <g transform="translate(105, 0)">
      <rect x="0" y="0" width="195" height="26" rx="13" fill="#0f2e24" stroke="#10b981" stroke-width="1.2" />
      <circle cx="12" cy="13" r="3.5" class="led1" />
      <text x="22" y="17" class="badge-text" fill="#6ee7b7">AUTO-EXTRACCIÓN: ON</text>
    </g>

    <!-- Badge 3: Huawei & Cisco Certified -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#171e35" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="12" cy="13" r="3.5" class="led2" />
      <text x="22" y="17" class="badge-text" fill="#93c5fd">CISCO • HUAWEI • MULTI</text>
    </g>

    <!-- Badge 4: Zero Footprint -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#1f1838" stroke="#a855f7" stroke-width="1.2" />
      <text x="14" y="17" class="badge-text" fill="#d8b4fe">🛡️ ZERO DEFENDER FP</text>
    </g>
  </g>
</svg>
