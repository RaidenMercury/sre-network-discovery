<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRE Network Discovery</title>
  <style>
    :root {
      --bg: #0f1119;
      --card-bg: rgba(30, 34, 53, 0.7);
      --card-border: rgba(45, 51, 80, 0.8);
      --text: #e8ecf5;
      --muted: #8891b0;
      --accent: #5b8def;
      --accent-hover: #4a7bdc;
      --success: #4ade80;
      --warning: #fbbf24;
      --error: #f87171;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(20, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(91, 141, 239, 0.4);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(74, 222, 128, 0.12);
      color: var(--success);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    main {
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input {
      background: #141724;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }

    .toggle-row span {
      font-size: 13px;
      color: var(--text);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2d3350;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(91, 141, 239, 0.35);
      width: 100%;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .validation-box {
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      background: rgba(91, 141, 239, 0.08);
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .validation-box.ok {
      border-left-color: var(--success);
      background: rgba(74, 222, 128, 0.08);
    }

    .validation-box.error {
      border-left-color: var(--error);
      background: rgba(248, 113, 113, 0.08);
    }

    .progress-container {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      background: rgba(20, 24, 38, 0.7);
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .progress-bar-bg {
      height: 8px;
      background: #1e2235;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      width: 0%;
      transition: width 0.3s;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .tab-btn.active {
      color: var(--text);
      background: rgba(91, 141, 239, 0.15);
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .switch-card {
      background: #141724;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, transform 0.1s;
    }

    .switch-card:hover {
      border-color: rgba(91, 141, 239, 0.5);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-proto {
      background: rgba(91, 141, 239, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-vlan {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .card-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      font-size: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-item span.label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .detail-item span.value {
      color: var(--text);
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .export-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: #1c2033;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #252b45;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>SRE Network Discovery</h1>
        <p>CDP / LLDP Native Scanner v2.0</p>
      </div>
    </div>
    <div class="status-badge" id="appStatus">
      <div class="status-dot"></div>
      <span id="appStatusText">Listo</span>
    </div>
  </header>

  <main>
    <div class="glass-panel">
      <div class="form-group">
        <label for="adapterSelect">Adaptador de Red Físico</label>
        <select id="adapterSelect"></select>
      </div>

      <div class="validation-box" id="validationBox" style="margin-bottom: 14px;">
        <div id="validationText">Seleccione un adaptador para comprobar enlace.</div>
      </div>

      <div class="controls-grid">
        <div class="toggle-row">
          <span>Modo Acumulativo (-a)</span>
          <label class="switch">
            <input type="checkbox" id="appendToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span>Auto-Extracción al Enchufar</span>
          <label class="switch">
            <input type="checkbox" id="autoToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="controls-grid" style="margin-top: 8px; margin-bottom: 14px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="durationInput">Duración (segundos)</label>
          <input type="number" id="durationInput" value="62" min="10" max="300">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="remoteUrlInput">Canal Seguro Remoto (Opcional)</label>
          <input type="text" id="remoteUrlInput" placeholder="https://api.empresa.com/sre">
        </div>
      </div>

      <button class="btn-primary" id="startBtn" onclick="toggleScan()">
        <span id="btnIcon">▶</span>
        <span id="btnText">Iniciar Escaneo de Red</span>
      </button>

      <div class="progress-container" id="progressContainer" style="margin-top: 14px;">
        <div class="progress-labels">
          <span id="progressStatus">Capturando tramas L2...</span>
          <span id="progressTimer">0s / 62s</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>
    </div>

    <div class="glass-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div class="tab-bar">
          <button class="tab-btn active" id="tabCards" onclick="setTab('cards')">Tarjetas (<span id="countDevices">0</span>)</button>
          <button class="tab-btn" id="tabText" onclick="setTab('text')">Texto Plano</button>
        </div>
        <div class="export-row">
          <button class="btn-secondary" onclick="exportReport('json')">JSON</button>
          <button class="btn-secondary" onclick="exportReport('md')">Markdown</button>
          <button class="btn-secondary" onclick="exportReport('csv')">CSV</button>
          <button class="btn-secondary" onclick="clearResults()">Limpiar</button>
        </div>
      </div>

      <div id="cardsView" class="cards-grid">
        <div class="empty-state">
          No hay switches registrados aún.<br>Inicie un escaneo para capturar anuncios CDP/LLDP del puerto.
        </div>
      </div>

      <div id="textView" style="display: none;">
        <textarea id="rawText" readonly style="width: 100%; height: 260px; background: #141724; border: 1px solid var(--card-border); color: #a5b4fc; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 11px;"></textarea>
      </div>
    </div>
  </main>

  <script>
    let isScanning = false;
    let timerInterval = null;
    let currentInventory = { devices: [] };

    async function loadAdapters() {
      try {
        const res = await fetch('/api/adapters');
        const adapters = await res.json();
        const sel = document.getElementById('adapterSelect');
        sel.innerHTML = '';
        adapters.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.name;
          opt.textContent = `${a.name} (${a.is_up ? 'UP' : 'DOWN'}) - ${a.mac}`;
          sel.appendChild(opt);
        });
        if (adapters.length > 0) {
          validateSelected();
        }
      } catch (err) {
        console.error("Error cargando adaptadores:", err);
      }
    }

    async function validateSelected() {
      const adapter = document.getElementById('adapterSelect').value;
      const remote = document.getElementById('remoteUrlInput').value;
      const box = document.getElementById('validationBox');
      const text = document.getElementById('validationText');

      try {
        const res = await fetch(`/api/validate?adapter=${encodeURIComponent(adapter)}&remote=${encodeURIComponent(remote)}`);
        const v = await res.json();
        box.className = 'validation-box ' + (v.is_up ? 'ok' : 'error');
        text.innerHTML = `<strong>${v.status_summary}</strong><br>
          IP: ${v.ipv4_addresses ? v.ipv4_addresses.join(', ') : 'Ninguna'} |
          Gateway: ${v.gateway || 'N/A'} (Alcanzable: ${v.gateway_alive ? 'Sí' : 'No'}) |
          DNS: ${v.dns_resolving ? 'OK' : 'Fallo'} | TLS Seguro: ${v.secure_channel_ok ? 'OK' : 'Inactivo'}`;
      } catch (err) {
        box.className = 'validation-box error';
        text.textContent = 'Error comprobando estado de punto de red.';
      }
    }

    document.getElementById('adapterSelect').addEventListener('change', validateSelected);

    async function loadInventory() {
      try {
        const res = await fetch('/api/inventory');
        currentInventory = await res.json();
        renderDevices();
      } catch (err) {
        console.error(err);
      }
    }

    function renderDevices() {
      const container = document.getElementById('cardsView');
      const raw = document.getElementById('rawText');
      const count = document.getElementById('countDevices');
      const devices = currentInventory.devices || [];

      count.textContent = devices.length;
      raw.value = JSON.stringify(currentInventory, null, 2);

      if (devices.length === 0) {
        container.innerHTML = `<div class="empty-state">No hay switches registrados aún.<br>Inicie un escaneo para capturar anuncios CDP/LLDP del puerto.</div>`;
        return;
      }

      container.innerHTML = '';
      devices.forEach(d => {
        const card = document.createElement('div');
        card.className = 'switch-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">
              <span>${escapeHtml(d.switch_name || 'Switch Desconocido')}</span>
              <span class="badge-proto">${d.protocol}</span>
            </div>
            ${d.vlan ? `<span class="badge-vlan">VLAN ${d.vlan}</span>` : ''}
          </div>
          <div class="card-details">
            <div class="detail-item">
              <span class="label">Puerto Switch</span>
              <span class="value">${escapeHtml(d.port || '-')}</span>
            </div>
            <div class="detail-item">
              <span class="label">IP de Gestión</span>
              <span class="value">${escapeHtml(d.switch_ip || 'No anunciada')}</span>
            </div>
            <div class="detail-item">
              <span class="label">Modelo Hardware</span>
              <span class="value">${escapeHtml(d.model || '-')}</span>
            </div>
            <div class="detail-item">
              <span class="label">Adaptador Local</span>
              <span class="value">${escapeHtml(d.local_adapter || '-')}</span>
            </div>
            <div class="detail-item">
              <span class="label">Detecciones Acumuladas</span>
              <span class="value">${d.times_seen} vez/veces</span>
            </div>
            <div class="detail-item">
              <span class="label">Último Visto</span>
              <span class="value">${new Date(d.last_seen).toLocaleTimeString()}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function toggleScan() {
      if (isScanning) return;

      const adapter = document.getElementById('adapterSelect').value;
      const duration = parseInt(document.getElementById('durationInput').value) || 62;
      const append = document.getElementById('appendToggle').checked;
      const remote = document.getElementById('remoteUrlInput').value;

      isScanning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('btnText').textContent = 'Escaneando...';
      document.getElementById('appStatusText').textContent = 'Capturando';
      document.getElementById('progressContainer').style.display = 'flex';

      let elapsed = 0;
      const fill = document.getElementById('progressBarFill');
      const timer = document.getElementById('progressTimer');
      fill.style.width = '0%';

      timerInterval = setInterval(() => {
        elapsed++;
        const pct = Math.min(100, Math.round((elapsed / duration) * 100));
        fill.style.width = pct + '%';
        timer.textContent = `${elapsed}s / ${duration}s`;
        if (elapsed >= duration) clearInterval(timerInterval);
      }, 1000);

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adapter,
            duration,
            append,
            remote
          })
        });
        const data = await res.json();
        if (data.error) {
          alert("Error: " + data.error);
        } else {
          currentInventory = data;
          renderDevices();
        }
      } catch (err) {
        alert("Fallo de comunicación: " + err.message);
      } finally {
        clearInterval(timerInterval);
        isScanning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('btnText').textContent = 'Iniciar Escaneo de Red';
        document.getElementById('appStatusText').textContent = 'Listo';
        document.getElementById('progressContainer').style.display = 'none';
      }
    }

    function setTab(tab) {
      document.getElementById('tabCards').classList.toggle('active', tab === 'cards');
      document.getElementById('tabText').classList.toggle('active', tab === 'text');
      document.getElementById('cardsView').style.display = tab === 'cards' ? 'flex' : 'none';
      document.getElementById('textView').style.display = tab === 'text' ? 'block' : 'none';
    }

    function exportReport(fmt) {
      window.open(`/api/export?format=${fmt}`, '_blank');
    }

    async function clearResults() {
      if (confirm("¿Desea limpiar el inventario acumulado actual?")) {
        await fetch('/api/clear', { method: 'POST' });
        loadInventory();
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    loadAdapters();
    loadInventory();
  </script>
</body>
</html>
